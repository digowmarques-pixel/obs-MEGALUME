<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2A6B"/>
      <stop offset="1" stop-color="#2F6BFF"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF5A6E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FF5A6E" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- M made of two light beams meeting in a valley -->
  <path d="M120 372 L120 168 Q120 140 144 154 L256 262 L368 154 Q392 140 392 168 L392 372"
        fill="none" stroke="url(#beam)" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="392" cy="122" r="70" fill="url(#glow)"/>
  <circle cx="392" cy="122" r="30" fill="#FF3B57"/>
</svg>
